<script>
/* ------------------------------------------------------------------
   Tuition Desk: sample frontend.
   All data lives in `db` (in memory + localStorage). When the Google Sheet
   backend is ready, only the small "data layer" functions need to change:
   markAttendance, saveStudent, saveClass, saveTeacher, load, save.
------------------------------------------------------------------- */
const CONFIG = { institute: 'Sample Tuition Institute', storageKey: 'tuition-desk-sample-v1' };
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const NAV = [['dashboard','Dashboard','#5B9BFF'],['scan','Mark attendance','#3DDC97'],['logs','Attendance log','#B794F6'],['students','Students','#FF9F5A'],['classes','Classes','#4FD1E0'],['teachers','Teachers','#FF7EB6']];
const $ = (s, r = document) => r.querySelector(s);

/* ---------- helpers ---------- */
const pad = (n, l = 2) => String(n).padStart(l, '0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => dstr(new Date());
const nowTime = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fmtDate = s => parseD(s).toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short', year:'numeric' });

const fmtTime = t => { const [h,m] = t.split(':').map(Number); return `${h%12||12}:${pad(m)} ${h<12?'AM':'PM'}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stamp = a => a.date + ' ' + a.time;
const PAL = ['#2F6FED','#1F8A5B','#C2410C','#7B4FD6','#B8326E','#0E7490'];
const SUBJ = { mathematics:'#2F6FED', science:'#1F8A5B', english:'#C2410C', ict:'#7B4FD6' };
const hashStr = t => { let n = 0; for (const ch of String(t)) n = (n * 31 + ch.charCodeAt(0)) >>> 0; return n; };
const subjColor = subject => SUBJ[String(subject).toLowerCase()] || PAL[hashStr(subject) % PAL.length];
const gradeColor = g => PAL[Number(g) % PAL.length];
const avatar = (s, big) => `<span class="av ${big ? 'lg' : ''}" style="--c:${PAL[hashStr(s.id) % PAL.length]}" aria-hidden="true">${esc(s.name.split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase())}</span>`;

/* ---------- data layer ---------- */
function seed() {
  const teachers = [
    { id:'TCH-001', name:'Nimal Perera', phone:'0771234567', subject:'Mathematics' },
    { id:'TCH-002', name:'Sanduni Fernando', phone:'0712345678', subject:'Science' },
    { id:'TCH-003', name:'Kasun Wijesinghe', phone:'0759876543', subject:'English' },
    { id:'TCH-004', name:'Dilani Jayasinghe', phone:'0763456789', subject:'ICT' }
  ];
  const classes = [
    { id:'CLS-001', name:'Grade 9 Mathematics',  grade:9,  subject:'Mathematics', teacherId:'TCH-001', day:'Saturday',  time:'08:00' },
    { id:'CLS-002', name:'Grade 10 Mathematics', grade:10, subject:'Mathematics', teacherId:'TCH-001', day:'Saturday',  time:'10:00' },
    { id:'CLS-003', name:'Grade 10 Science',     grade:10, subject:'Science',     teacherId:'TCH-002', day:'Sunday',    time:'08:00' },
    { id:'CLS-004', name:'Grade 11 Science',     grade:11, subject:'Science',     teacherId:'TCH-002', day:'Saturday',  time:'14:00' },
    { id:'CLS-005', name:'Grade 9 English',      grade:9,  subject:'English',     teacherId:'TCH-003', day:'Sunday',    time:'10:00' },
    { id:'CLS-006', name:'Grade 10 English',     grade:10, subject:'English',     teacherId:'TCH-003', day:'Friday',    time:'16:00' },
    { id:'CLS-007', name:'Grade 11 ICT',         grade:11, subject:'ICT',         teacherId:'TCH-004', day:'Sunday',    time:'14:00' },
    { id:'CLS-008', name:'Grade 11 Mathematics', grade:11, subject:'Mathematics', teacherId:'TCH-001', day:'Wednesday', time:'16:00' }
  ];
  const joined = dstr(new Date(Date.now() - 60 * 864e5));
  const mk = (n, name, grade, phone, parent, address, classIds) =>
    ({ id:'STU-' + pad(n, 4), name, grade, phone, parentPhone:parent, address, joinDate:joined, status:'Active', classIds });
  const students = [
    mk(1,  'Kavindu Perera',       9,  '0771100001', '0712200001', 'Negombo',     ['CLS-001','CLS-005']),
    mk(2,  'Nethmi Silva',         9,  '',           '0712200002', 'Kochchikade', ['CLS-001','CLS-005']),
    mk(3,  'Sahan Rajapaksha',     9,  '0771100003', '0712200003', 'Katunayake',  ['CLS-001']),
    mk(4,  'Hansini Dissanayake',  9,  '',           '0712200004', 'Negombo',     ['CLS-005']),
    mk(5,  'Tharushi Fernando',    10, '0771100005', '0712200005', 'Ja-Ela',      ['CLS-002','CLS-003','CLS-006']),
    mk(6,  'Dinuka Bandara',       10, '0771100006', '0712200006', 'Negombo',     ['CLS-002','CLS-003']),
    mk(7,  'Ishara Gunasekara',    10, '',           '0712200007', 'Seeduwa',     ['CLS-002','CLS-006']),
    mk(8,  'Amaya Wickramasinghe', 10, '0771100008', '0712200008', 'Kandana',     ['CLS-003','CLS-006']),
    mk(9,  'Malith Kumara',        10, '',           '0712200009', 'Negombo',     ['CLS-002']),
    mk(10, 'Lahiru Senanayake',    11, '0771100010', '0712200010', 'Ragama',      ['CLS-004','CLS-007','CLS-008']),
    mk(11, 'Chamodi Herath',       11, '0771100011', '0712200011', 'Negombo',     ['CLS-004','CLS-008']),
    mk(12, 'Ravindu Jayawardena',  11, '',           '0712200012', 'Wattala',     ['CLS-004','CLS-007'])
  ];
  const attendance = [];
  let s = 20260919;
  const rnd = () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  classes.forEach(c => {

      const dd = new Date(now.getFullYear(), now.getMonth(), now.getDate() - back - 7 * k);

        }
      });
    }
  });
  return { teachers, classes, students, attendance };
}
function load() { try { const r = localStorage.getItem(CONFIG.storageKey); return r ? JSON.parse(r) : null; } catch (e) { return null; } }

let db = load() || seed();

const stu = id => db.students.find(s => s.id === id);

const enrolledOf = cid => db.students.filter(s => s.status === 'Active' && s.classIds.includes(cid)).sort((a,b) => a.name.localeCompare(b.name));
function nextId(prefix, list, len) {
  const max = list.reduce((m, x) => Math.max(m, parseInt(x.id.split('-')[1], 10) || 0), 0);
  return `${prefix}-${pad(max + 1, len)}`;
}
function normId(raw) {
  const v = String(raw).trim().toUpperCase().replace(/\s+/g, '');
  if (/^\d+$/.test(v)) return 'STU-' + pad(parseInt(v, 10), 4);
  const m = v.match(/^STU-?(\d+)$/);
  return m ? 'STU-' + pad(parseInt(m[1], 10), 4) : v;
}
/* The one function the scanner calls. Later: send to Apps Script instead. */
function markAttendance(rawId, classId, force = false) {
  const id = normId(rawId), c = cls(classId), s = stu(id);
  if (!s) return { type:'unknown', id };
  if (s.status !== 'Active') return { type:'inactive', student:s, cls:c };
  const date = todayStr();
  const dup = db.attendance.find(a => a.date === date && a.classId === classId && a.studentId === id);
  if (dup) return { type:'dup', student:s, cls:c, rec:dup };
  const enrolled = s.classIds.includes(classId);
  if (!enrolled && !force) return { type:'notEnrolled', student:s, cls:c };
  const rec = { date, time:nowTime(), studentId:id, classId };
  db.attendance.push(rec); save();
  return { type:'ok', student:s, cls:c, rec, walkIn:!enrolled };
}

function beep(type) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const seq = type === 'ok' ? [[880, .09]] : (type === 'dup' || type === 'notEnrolled') ? [[440, .12], [440, .12]] : [[220, .18], [170, .2]];
    let t = actx.currentTime;
    seq.forEach(([f, d]) => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; g.gain.value = .08; o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d); t += d + .05; });
  } catch (e) { /* sound is optional */ }
}

}

function normPhone(v) {
  let p = String(v || '').replace(/[\s\-().]/g, '');
  if (p.startsWith('+94')) p = '0' + p.slice(3);
  else if (p.startsWith('94') && p.length === 11) p = '0' + p.slice(2);
  else if (/^\d{9}$/.test(p)) p = '0' + p;
  return p;
}
function saveStudent(f) {
  const d = Object.fromEntries(new FormData(f)), classIds = [...formState.classIds];
  const parent = normPhone(d.parentPhone), own = normPhone(d.phone), errs = [];
  if (!d.name.trim()) errs.push("Enter the student's full name.");
  if (!d.grade) errs.push('Select a grade.');
  if (!/^0\d{9}$/.test(parent)) errs.push('Parent phone needs 10 digits, for example 0771234567.');
  if (own && !/^0\d{9}$/.test(own)) errs.push('Student phone needs 10 digits, or leave it empty.');
  if (errs.length) { $('#formErr').textContent = errs.join(' '); return; }
  const base = { name:d.name.trim(), grade:Number(d.grade), phone:own, parentPhone:parent, address:(d.address || '').trim(), classIds };
  if (f.dataset.id) {
    const s = stu(f.dataset.id); Object.assign(s, base, { status:d.status || s.status });
    save(); closeModal(); render(); toast('Student updated');
  } else {
    const s = { id:nextId('STU', db.students, 4), ...base, joinDate:todayStr(), status:'Active' };
    db.students.push(s); save(); closeModal(); render(); openIdCard(s.id, 'Student registered', true);
  }
}

    <div><dt>Status</dt><dd><span class="tag ${s.status === 'Active' ? 'ok' : 'off'}">${s.status}</span></dd></div></dl>
  ${s.status !== 'Active' ? '<p class="note">Inactive: this student cannot be scanned and is left out of absent lists. Attendance history is kept.</p>' : ''}
  <h3 style="margin:10px 0 6px">Classes and attendance</h3><div class="panel">${perClass || '<div class="empty">Not enrolled in any class.</div>'}</div>
  <h3 style="margin:16px 0 6px">Recent attendance</h3>
  <div class="hist">${recs.slice(0, 20).map(r => `<div class="row"><span>${fmtDate(r.date)}, ${esc((cls(r.classId) || {}).name || '')}</span><span class="muted small">${fmtTime(r.time)}</span></div>`).join('') || '<div class="empty">No attendance yet.</div>'}</div>
  <div class="actions"><button class="btn" data-act="closeModal">Close</button><button class="btn" data-act="idCard" data-id="${s.id}">ID card</button><button class="btn ${s.status === 'Active' ? 'danger' : ''}" data-act="toggleStatus" data-id="${s.id}">${s.status === 'Active' ? 'Mark inactive' : 'Mark active'}</button><button class="btn primary" data-act="editStudent" data-id="${s.id}">Edit</button></div>`);
}
function openClassForm() {
  if (!db.teachers.length) { toast('Add a teacher first'); return; }
  const subjects = [...new Set(db.classes.map(c => c.subject))];
  openModal(`<h2>Add class</h2><form id="classForm"><div class="grid2">
    <div class="field"><span>Grade</span><select name="grade" required><option value="">Select grade</option>${gradeOptions('')}</select></div>
    <div class="field"><span>Subject</span><input name="subject" list="subjList" required><datalist id="subjList">${subjects.map(x => `<option value="${esc(x)}">`).join('')}</datalist></div>
    <div class="field"><span>Teacher</span><select name="teacherId" required>${db.teachers.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div>
    <div class="field"><span>Day</span><select name="day">${DAYS.map(d => `<option>${d}</option>`).join('')}</select></div>
    <div class="field"><span>Start time</span><input type="time" name="time" required value="08:00"></div></div>
    <div class="actions"><button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn primary" type="submit">Save class</button></div></form>`);
}
function openTeacherForm() {
  openModal(`<h2>Add teacher</h2><form id="teacherForm"><div class="grid2">
    <div class="field full"><span>Full name</span><input name="name" required></div>
    <div class="field"><span>Phone</span><input name="phone" required pattern="0[0-9]{9}" title="10 digits, for example 0771234567" inputmode="tel"></div>
    <div class="field"><span>Subject</span><input name="subject" required></div></div>
    <div class="actions"><button type="button" class="btn" data-act="closeModal">Cancel</button><button class="btn primary" type="submit">Save teacher</button></div></form>`);
}

/* ---------- render + events ---------- */
function render() {
  $('#nav').innerHTML = NAV.map(([k, l, c]) => `<button class="nav ${ui.page === k ? 'on' : ''}" style="--dot:${c}" data-page="${k}" ${ui.page === k ? 'aria-current="page"' : ''}>${l}</button>`).join('');
  const pages = { dashboard:pgDashboard, scan:pgScan, logs:pgLogs, students:pgStudents, classes:pgClasses, teachers:pgTeachers };
  $('#main').innerHTML = pages[ui.page]();
  drawBarcodes($('#main'));
  if (ui.page === 'scan' && modalEl().hidden) $('#scanInput')?.focus();
}
function act(name, el) {
  const d = el.dataset;
  switch (name) {
    case 'openScan': ui.scanClass = d.class; ui.page = 'scan'; ui.feedback = null; render(); window.scrollTo(0, 0); break;
    case 'fillId': { const i = $('#scanInput'); i.value = d.id; i.focus(); break; }
    case 'markAnyway': ui.feedback = markAttendance(d.id, ui.scanClass, true); beep(ui.feedback.type); render(); break;
    case 'logFilter': ui.logStatus = d.v; render(); break;
    case 'addStudent': openStudentForm(); break;
    case 'viewStudent': openProfile(d.id); break;
    case 'editStudent': openStudentForm(d.id); break;
    case 'idCard': openIdCard(d.id); break;
    case 'toggleStatus': { const s = stu(d.id); s.status = s.status === 'Active' ? 'Inactive' : 'Active'; save(); render(); openProfile(s.id); toast(`${s.name} is now ${s.status.toLowerCase()}`); break; }
    case 'addClass': openClassForm(); break;
    case 'addTeacher': openTeacherForm(); break;
    case 'closeModal': closeModal(); break;
    case 'print': try { window.print(); } catch (e) { toast('Printing is not available here'); } break;
    case 'reset':
      if (el.dataset.armed) { db = seed(); save(); ui.feedback = null; ui.scanClass = defaultClass(); render(); toast('Sample data restored'); }
      else { el.dataset.armed = '1'; el.textContent = 'Click again to confirm'; setTimeout(() => { el.dataset.armed = ''; el.textContent = 'Reset sample data'; }, 4000); }
      break;
  }
}
document.addEventListener('click', e => {
  if (e.target.id === 'modal') { closeModal(); return; }
  const nav = e.target.closest('[data-page]');
  if (nav) { ui.page = nav.dataset.page; ui.feedback = null; render(); window.scrollTo(0, 0); return; }
  const a = e.target.closest('[data-act]');
  if (a) { act(a.dataset.act, a); return; }
  if (ui.page === 'scan' && modalEl().hidden && !e.target.closest('input,select,textarea,button,label,a')) $('#scanInput')?.focus();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !modalEl().hidden) closeModal();
  if (e.key === 'Enter' && e.target.matches('tr[data-act]')) act(e.target.dataset.act, e.target);
});
document.addEventListener('input', e => {
  if (e.target.id === 'stuSearch') { ui.stuSearch = e.target.value; $('#stuTable').innerHTML = stuTable(); }
  else if (e.target.name === 'name' && e.target.closest('#studentForm')) { const n = $('#cardPreview .idname'); if (n) n.textContent = e.target.value.trim() || 'New student'; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'scanClass') { ui.scanClass = t.value; ui.feedback = null; render(); }
  else if (t.id === 'statusFilter') { ui.stuStatus = t.value; $('#stuTable').innerHTML = stuTable(); }
  else if (t.id === 'gradeFilter') { ui.stuGrade = t.value; $('#stuTable').innerHTML = stuTable(); }
  else if (t.id === 'logDate') { ui.logDate = t.value || todayStr(); render(); }
  else if (t.id === 'logClass') { ui.logClass = t.value; render(); }
  else if (t.id === 'fGrade') { formState.grade = t.value; $('#classPicker').innerHTML = pickerHtml(); const gl = $('#cardPreview .idgrade'); if (gl) gl.textContent = t.value ? 'Grade ' + t.value : 'Grade -'; }
  else if (t.id === 'showAllClasses') { formState.showAll = t.checked; $('#classPicker').innerHTML = pickerHtml(); }
  else if (t.closest('#classPicker') && t.type === 'checkbox') { t.checked ? formState.classIds.add(t.value) : formState.classIds.delete(t.value); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'scanForm') {
    const v = $('#scanInput').value;
    if (!v.trim()) return;
    ui.feedback = markAttendance(v, ui.scanClass);
    beep(ui.feedback.type);
    render();
  } else if (f.id === 'studentForm') saveStudent(f);
  else if (f.id === 'classForm') {
    const d = Object.fromEntries(new FormData(f)), g = Number(d.grade), subject = d.subject.trim();
    db.classes.push({ id:nextId('CLS', db.classes, 3), name:`Grade ${g} ${subject}`, grade:g, subject, teacherId:d.teacherId, day:d.day, time:d.time });
    save(); closeModal(); render(); toast('Class added');
  } else if (f.id === 'teacherForm') {
    const d = Object.fromEntries(new FormData(f));
    db.teachers.push({ id:nextId('TCH', db.teachers, 3), name:d.name.trim(), phone:d.phone.trim(), subject:d.subject.trim() });
    save(); closeModal(); render(); toast('Teacher added');
  }
});
render();
</script>
</body>
</html>
